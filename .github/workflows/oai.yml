name: AI 扫描

# 重要：本文件 ci.yml.new 是给 GitHub 机器人没有 workflows 写权限时用的迁移源。
# 维护方式：当 oai.yml 需要更新时，由 bot 把新内容写进本文件，
# 仓库维护者用网页编辑器把 ci.yml.new 整段复制到 .github/workflows/oai.yml 并提交。
# 本文件与 oai.yml 内容始终保持一致。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天澳门时间 09:00 / 17:00 自动扫描并推送（GitHub cron 为 UTC：01:00 / 09:00）
    - cron: '0 1 * * *'   # 09:00 澳门时间（UTC 01:00）
    - cron: '0 9 * * *'   # 17:00 澳门时间（UTC 09:00）
  workflow_dispatch:
    inputs:
      channels:
        description: '要扫描的频道，多个用 | 分隔，留空使用全部 56 个频道全量扫描'
        required: false
        default: ''
        type: string
      push_to_wechat:
        description: '扫描完成后自动推送到微信（PushPlus）'
        required: false
        default: false
        type: boolean
      pushplus_token:
        description: '临时 PushPlus token（优先于 Secrets.PUSHPLUS_TOKEN）'
        required: false
        default: ''
        type: string
      enable_ai_summary:
        description: '推送前用 AI（DeepSeek）对视频字幕做主题聚类总结'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: 20

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm install

      - name: Check syntax and run self-test
        # 自测覆盖：72 小时时效验证、AI 多空概率（含无 Key 时的规则降级）、总结块渲染
        run: npm test

      - name: Verify server starts
        timeout-minutes: 2
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -sf --max-time 5 http://localhost:3000/ > /dev/null || { echo "::error::Server failed to start"; kill $SERVER_PID 2>/dev/null; exit 1; }
          kill $SERVER_PID 2>/dev/null
          echo "✅ Server started and responded on port 3000"

  # ─── 手动触发 + 微信推送 ───
  scan-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_wechat }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm install

      - name: Scan and push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ inputs.pushplus_token != '' && inputs.pushplus_token || secrets.PUSHPLUS_TOKEN }}
          CHANNELS_INPUT: ${{ inputs.channels }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ENABLE_AI_SUMMARY: ${{ inputs.enable_ai_summary }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::缺少 PushPlus token：请在 workflow_dispatch 填 pushplus_token 或在仓库 Secrets 配置 PUSHPLUS_TOKEN"
            exit 1
          fi

          # 启动本地 server
          PORT=3000 node server.js &
          SERVER_PID=$!
          sleep 3
          curl -sf --max-time 5 http://localhost:3000 || { echo "::error::server 未启动"; kill $SERVER_PID 2>/dev/null; exit 1; }

          # 默认全量 56 个频道清单
          ALL_56_CHANNELS='["信報財經新聞","Finance730","香港經濟日報 HKET","香港財經時報 HKBT","新城財經台","香港金融管理局","游庭皓的財經皓角","柴鼠兄弟 ZRBros","风傳媒-下班经济學","老王愛說笑","SHIN LI","自由女神邱沁宜","Better Leaf 好葉","慢活夫妻 George & Dewi","大俠武林","股乾爹 KuKanTieh","Gooaye股癌","理財不能等","懶錢包LazyWallet","M觀點","蕾咪Rami","財經 M 平方 MacroMicro","元大投顧財金頻道","股海老牛","财经风云","视野环球财经","阳光财经","ChineseFN 中文投資網","财经全世界","老李玩钱","土妹发财","贝拉说美股","美投说美股","艾爾文","寶可孟の省錢大作戰","吳淡如人生實用商學院","郭哲榮分析師","央视财经","Bloomberg中国","老徐价值投资","小Lin说","CK财经频道","钱姐说钱","硅谷居士","Mr.Market市场先生","财报狗","天下杂志","商业周刊","今周刊","非凡财经新闻","东森财经新闻","第一财经","FT中文网","观视频工作室","睡前消息","曲博科技教室"]'

          # 解析频道：支持 | 、, 、换行 分隔；留空或填 ALL 时默认全量 56 个频道
          if [ -z "$CHANNELS_INPUT" ] || [ "$CHANNELS_INPUT" = "ALL" ]; then
            CHANNELS_JSON="$ALL_56_CHANNELS"
          else
            CHANNELS_JSON=$(node -e "
              const raw = process.env.CHANNELS_INPUT || '';
              const arr = raw.split(/[|\n,]+/).map(s=>s.trim()).filter(Boolean);
              console.log(JSON.stringify(arr));
            ")
          fi
          echo "Channels: $CHANNELS_JSON"

          # 调用本地 /api/scan
          SCAN_RESP=$(curl -s --max-time 900 -X POST http://localhost:3000/api/scan \
            -H 'Content-Type: application/json' \
            -d "{\"channels\": $CHANNELS_JSON}")
          echo "$SCAN_RESP" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              try{const j=JSON.parse(d);if(!j.items) throw Error('no items'); console.log('扫描到', j.items.length, '条');}
              catch(e){console.error('扫描结果解析失败',e.message, d.slice(0,500)); process.exit(1)}
            })"
          echo "$SCAN_RESP" > scan_result.json

          # 生成 DOS 监视器 · 复古终端 HTML 并分条推送到 PushPlus
          node << 'NODE'
          import fs from 'node:fs';
          const scan = JSON.parse(fs.readFileSync('scan_result.json','utf8'));
          const allItems = scan.items || [];
          // 时效验证：只保留最近 72 小时内发布的内容（超时 / 无法验证发布时间 → 隐藏，不推送）
          const FRESH_WINDOW_MS = 72*60*60*1000;
          const FRESH_WINDOW_LABEL = '72 小时';
          const nowMs = Date.now();
          const isFresh = x => {
            if (x.error) return true;
            const t = x.publishedAt ? new Date(x.publishedAt).getTime() : NaN;
            return Number.isFinite(t) && (nowMs - t) <= FRESH_WINDOW_MS;
          };
          const items = allItems.filter(isFresh);
          const hiddenItems = (scan.hidden || []);
          console.log(`时效验证：保留 ${items.length} 条，隐藏 ${allItems.length - items.length} 条（服务端另记录 ${hiddenItems.length} 条超时/无法验证）`);
          if (!items.length || !items.some(x => !x.error)) {
            console.log(`最近 ${FRESH_WINDOW_LABEL}内没有可推送的有效内容（超时内容已隐藏），本次不推送。`);
            fs.writeFileSync('brief.html', '<p>最近 ' + FRESH_WINDOW_LABEL + '内没有新的内容（超时内容已隐藏）</p>');
            fs.writeFileSync('chunks.json', JSON.stringify({ header: '', footer: '', chunks: [], title: '' }, null, 2));
            process.exit(0);
          }

          const esc = s => String(s||'').replace(/[&<>\"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[c]));

          // 不推个股页：剥离简报中任何按个股拆分的板块/页面，只保留全景汇总
          function stripStockSections(html) {
            if (!html) return html;
            let out = String(html);
            out = out.replace(/<section\b[^>]*data-kind=(["'])stock-page\1[^>]*>[\s\S]*?<\/section>/gi, '');
            out = out.replace(/<section\b[^>]*class=(["'])[^"']*\bstock-page\b[^"']*\1[^>]*>[\s\S]*?<\/section>/gi, '');
            out = out.replace(/<section\b[^>]*>[\s\S]*?<\/section>/gi, (m) =>
              /&gt;\s*(个股页|個股頁|STOCK PAGE)\s*<|>(个股页|個股頁|STOCK PAGE)</.test(m) ? '' : m);
            return out;
          }

          // AI 多空概率（看多 / 看空）条形图：微信会剥离 class，因此全部 inline

          const lsBar = (v, w = 10) => { const k = Math.max(0, Math.min(w, Math.round(v / 100 * w))); return '█'.repeat(k) + '░'.repeat(w - k); };

          const lsBlock = x => {

            const bb = x.bullBear;

            if (!bb || typeof bb.bull !== 'number') return '';

            const src = bb.source === 'ai' ? 'DeepSeek 多空推理' : '本地规则推算（未配置 AI Key）';

            return `<div style="margin-top:8px;padding:8px 10px;background:#031203;border:1px solid #0d9b4c;">

                    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:'Courier New',Consolas,monospace;font-size:9px;flex-wrap:wrap;">

                      <span style="background:#00ff66;color:#041404;padding:1px 5px;font-weight:700;letter-spacing:0.5px;">AI 多空概率</span>

                      <span style="background:#041404;color:#b8f2cb;padding:1px 5px;font-weight:700;">多 ${bb.bull}% / 空 ${bb.bear}%</span>

                    </div>

                    <div style="margin-top:6px;font-family:'Courier New',Consolas,monospace;font-size:10.5px;color:#b8f2cb;font-weight:700;line-height:1.9;word-break:break-all;white-space:pre-wrap;">多 ${lsBar(bb.bull)} ${bb.bull}%

          空 ${lsBar(bb.bear)} ${bb.bear}%</div>

                    <div style="margin-top:4px;font-family:'Courier New',Consolas,monospace;font-size:9px;color:#63b47f;line-height:1.7;">${esc(bb.note || '')} · 模型：${src} · 仅供研究参考，不构成投资建议${x.transcript ? '' : '<br>未读取到公开中文字幕 · 概率由 AI 依据标题与频道推算'}</div>

                  </div>`;

          };

          const sections = items.map((x,i)=> x.error
            ? `<section style="margin:10px 0;border:1px solid #b98600;background:#1a1203;box-shadow:0 0 6px rgba(255,176,0,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                <div style="display:flex;align-items:center;gap:6px;background:#ffb000;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                  <span style="background:#041404;color:#ffb000;padding:1px 5px;">■</span>
                  <span>SCAN_ERROR.LOG</span>
                  <span style="margin-left:auto;background:#041404;color:#8a6a12;padding:1px 5px;font-weight:400;">[${i+1}] ${esc(x.channel)} · 未完成读取</span>
                </div>
                <p style="margin:8px 10px;color:#ffb000;font-size:11.5px;line-height:1.6;font-weight:700;font-family:'Courier New',Consolas,monospace;">&gt; ${esc(x.error)}</p>
              </section>`
            : `<section style="margin:10px 0;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 6px rgba(0,255,102,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;background:#00ff66;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;word-break:break-all;">
                    <span style="background:#041404;color:#00ff66;padding:1px 5px;font-weight:400;">#${i+1}</span>
                    <span>DIR ▸ ${esc(x.channel)}</span>
                  </div>
                  ${x.status?`<span style="background:#041404;color:#8fdca4;padding:1px 5px;flex-shrink:0;font-weight:400;">${esc(x.status)}</span>`:''}
                </div>
                <div style="padding:10px 12px;">
                  <div style="color:#2c6742;font-family:'Courier New',Consolas,monospace;font-size:9.5px;letter-spacing:0.5px;font-weight:400;">C:\\BRIEF\\LOGS&gt; ${esc(x.publishedLabel || x.published || '')}${x.publishedMacau ? ' · ' + esc(x.publishedMacau) : ''} · 时效验证 ✓ ${FRESH_WINDOW_LABEL}内</div>
                  <h3 style="margin:6px 0 8px;font-size:13.5px;line-height:1.55;font-weight:700;">
                    <a href="${esc(x.url)}" style="color:#eafff0;font-weight:700;text-decoration:underline;text-decoration-color:#3f8f5b;text-underline-offset:3px;word-break:break-all;">&gt; ${esc(x.title)}</a>
                  </h3>
                  ${lsBlock(x)}
                  ${x.transcript ? `
                    <div style="margin-top:8px;padding:8px 10px;background:#031203;border-left:3px solid #0d9b4c;color:#8fdca4;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.75;font-weight:400;">${esc(x.transcript).replace(/(^|\n)(\d{1,2}:\d{2}(?::\d{2})?)/g, '$1<span style="color:#2c6742;font-size:10px;">$2</span>')}</div>
                  ` : ''}
                </div>
              </section>`
          ).join('');

          // AI 总结（可选）：DeepSeek 主题聚类；失败自动降级，content 仍可推送
          let summaryHtml = '';
          if (String(process.env.ENABLE_AI_SUMMARY) === 'true' && process.env.DEEPSEEK_API_KEY) {
            try {
              const r = await fetch('http://localhost:3000/api/summarize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items })
              });
              const d = await r.json();
              if (r.ok && d && d.ok && d.summaryHtml) {
                summaryHtml = d.summaryHtml;
                console.log('✅ 已附加 AI 主题聚类总结');
              } else {
                console.log('⚠️ AI 总结未启用/失败，降级推送：', d && (d.reason || d.error) || ('HTTP ' + r.status));
              }
            } catch (e) {
              console.log('⚠️ AI 总结异常，降级推送：', e.message);
            }
          } else {
            console.log('ℹ️ 未启用 AI 总结（ENABLE_AI_SUMMARY 或 DEEPSEEK_API_KEY 缺失）');
          }

          const baseContent = `<div style="font-family:'Courier New',Consolas,'SimSun',monospace;background-color:#041404;color:#8fdca4;padding:14px 12px;font-size:12px;line-height:1.75;max-width:680px;margin:0 auto;box-sizing:border-box;letter-spacing:0.3px;">

            <!-- DOS 顶部命令行 / Command Bar -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px dashed #0d9b4c;font-family:'Courier New',Consolas,monospace;font-size:10px;margin-bottom:12px;letter-spacing:0.5px;flex-wrap:wrap;gap:4px;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="display:inline-block;width:7px;height:7px;background:#00ff66;box-shadow:0 0 4px rgba(0,255,102,0.8);"></span>
                <span style="color:#00ff66;font-weight:700;">C:\\OCTOPUS\\AI&gt; PANORAMA.EXE</span>
              </div>
              <span style="background:#00ff66;color:#041404;padding:1px 6px;font-weight:700;font-size:9px;">DOS MONITOR · 复古终端</span>
            </div>

            <!-- 时效验证说明：只保留最近 72 小时内发布的内容 -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px dashed #0d9b4c;background:#031203;font-family:'Courier New',Consolas,monospace;font-size:9.5px;margin-bottom:12px;letter-spacing:0.5px;flex-wrap:wrap;gap:4px;">
              <span style="color:#00ff66;font-weight:700;">FRESHNESS CHECK ▸ 只保留最近 ${FRESH_WINDOW_LABEL}内发布的内容</span>
              <span style="color:#63b47f;font-weight:400;">超时 / 无法验证发布时间的内容已隐藏 · 本次共 ${items.length} 条</span>
            </div>

            <!-- 视频情报流 -->
            ${sections}

            <!-- 尾页宣言 / Editorial Manifesto -->
            <div style="margin-top:16px;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 8px rgba(0,255,102,0.18);">
              <div style="display:flex;justify-content:space-between;align-items:center;background:#00ff66;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:9.5px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;gap:4px;">
                <span>EDITORIAL_MANIFESTO.TXT</span>
                <span style="font-weight:400;opacity:0.75;">章鱼 AI · 全景视野</span>
              </div>
              <div style="padding:12px;">
                <div style="font-size:12px;font-weight:700;color:#eafff0;line-height:1.6;margin-bottom:8px;">
                  作者：章鱼 ai &nbsp; &nbsp; &nbsp; 仅供参考，分析研究
                </div>
                <div style="font-size:11.5px;color:#63b47f;line-height:1.8;text-align:justify;border-left:3px solid #0d9b4c;padding:8px 10px;background:#031203;margin-bottom:10px;">
                  <span style="color:#00ff66;font-weight:700;">全网境内外为你寻找蛛丝马迹-提供全景视野分析</span> 由多模型协同推理决策 ，底层所使用的大语言模型（LLM）多模式背后结合使用了多种不同的先进模型，包括但不限于 Claude、ChatGPT、Gemini、Grok、Qwen 以及 Kimi。 根据不同的资产管理任务需求，更好地发挥各个模型的优势来提供数据支持！[加油]
                </div>
                <div style="font-family:'Courier New',Consolas,monospace;font-size:9px;color:#3f8f5b;font-weight:400;text-align:center;border-top:1px dashed #0d9b4c;padding-top:6px;">
                  DOS MONITOR · 复古终端 · 微信竖版阅读版 · 仅供研究参考
                </div>
                <div style="margin-top:8px;font-family:'Courier New',Consolas,monospace;font-size:10px;color:#2c6742;font-weight:400;">C:\\OCTOPUS\\AI&gt; EXIT<span>█</span></div>
              </div>
            </div>

          </div>`;

          // 不推个股页：发送前剥离个股板块/个股页
          const content = stripStockSections((summaryHtml || '') + baseContent);
          const title = '章鱼 AI 全景分析';
          fs.writeFileSync('brief.html', content);

          const PUSHPLUS_MAX_CHARS = 90000;
          function splitHtmlBySections(html, maxChars = PUSHPLUS_MAX_CHARS) {
            const parts=[]; const secs = html.split(/(?=<section\b)/i).filter(s=>s.trim()); let buf='';
            const flush=()=>{ if(buf.trim()){ parts.push(buf); buf=''; } };
            const splitOversizedSection=(sec,max)=>{
              const out=[]; const headMatch=sec.match(/^<section\b[^>]*>/i); const head=headMatch?headMatch[0]:'<section>'; const tailMatch=sec.match(/<\/section>\s*$/i); const tail=tailMatch?tailMatch[0]:'</section>'; const headEnd=headMatch?headMatch[0].length:9; const inner=sec.slice(headEnd, sec.length-tail.length); const pieceBudget=max-Buffer.byteLength(head+tail,'utf8');
              if(pieceBudget<=0){ let s=sec; while(Buffer.byteLength(s,'utf8')>max){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(Buffer.byteLength(s.slice(0,mid),'utf8')<=max) lo=mid; else hi=mid-1;} out.push(s.slice(0,lo)); s=s.slice(lo);} if(s) out.push(s); return out; }
              const chunks=inner.split(/(?=<\/p>|<p\b|<br\s*\/?>|。)/i); let cur='';
              for(const c of chunks){ if(Buffer.byteLength(c,'utf8')>pieceBudget){ if(cur){ out.push(head+cur+tail); cur=''; } let s=c; while(Buffer.byteLength(s,'utf8')>pieceBudget){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(Buffer.byteLength(s.slice(0,mid),'utf8')<=pieceBudget) lo=mid; else hi=mid-1;} let cut=lo; const win=s.slice(Math.max(0,lo-200),lo); const m=win.match(/[。！？\n]/g); if(m) cut=lo-200+win.lastIndexOf(m[m.length-1])+1; out.push(head+s.slice(0,cut)+tail); s=s.slice(cut);} if(s) cur=s; } else if(Buffer.byteLength(cur+c,'utf8')>pieceBudget && cur){ out.push(head+cur+tail); cur=c; } else { cur+=c; } } if(cur) out.push(head+cur+tail); return out;
            };
            for(const sec of secs){ if(Buffer.byteLength(sec,'utf8')>maxChars){ flush(); for(const p of splitOversizedSection(sec,maxChars)) parts.push(p); continue; } if(Buffer.byteLength(buf+sec,'utf8')>maxChars) flush(); buf+=sec; } flush(); return parts;
          }

          let header='', footer='', bodyOnly=content;
          const firstIdx=content.search(/<section\b/i); const lastEnd=content.toLowerCase().lastIndexOf('</section>');
          if(firstIdx!==-1 && lastEnd!==-1 && lastEnd>firstIdx){ header=content.slice(0,firstIdx); footer=content.slice(lastEnd+'</section>'.length); bodyOnly=content.slice(firstIdx,lastEnd+'</section>'.length); }
          else if(firstIdx!==-1){ header=content.slice(0,firstIdx); bodyOnly=content.slice(firstIdx); footer=''; }
          const overhead=Buffer.byteLength(header+footer,'utf8');
          let chunks= overhead>90000 ? splitHtmlBySections(content,90000) : splitHtmlBySections(bodyOnly, 90000-overhead);
          if(!chunks.length){ const fb=(header+bodyOnly+footer)||content; chunks=splitHtmlBySections(fb,90000); if(!chunks.length) chunks=[fb]; if(header||footer){header=''; footer='';} }
          console.log(`内容 ${Buffer.byteLength(content,'utf8')} 字节，分 ${chunks.length} 条发送`);
          fs.writeFileSync('chunks.json', JSON.stringify({header, footer, chunks, title}, null, 2));

          const token = process.env.PUSHPLUS_TOKEN;
          let okCount=0;
          for(let i=0;i<chunks.length;i++){
            const partTitle = chunks.length>1 ? `${title} (${i+1}/${chunks.length})` : title;
            const partContent = (header||footer) ? `${header}${chunks[i]}${footer}` : chunks[i];
            const payload = JSON.stringify({ token, title: partTitle, content: partContent, template: 'html', channel: 'wechat' });
            console.log(`推送 ${i+1}/${chunks.length}: ${partTitle} (${Buffer.byteLength(partContent,'utf8')} bytes)`);
            let r, text, data;
            try {
              r = await fetch('https://www.pushplus.plus/send', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: payload });
              text = await r.text();
              try{ data=JSON.parse(text);}catch{ data={raw:text} }
            } catch(e){
              console.error(`第 ${i+1} 条网络异常:`, e.message);
              process.exit(1);
            }
            console.log(`  -> HTTP ${r.status}`, JSON.stringify(data).slice(0,500));
            if(data.code!==200){ console.error(`第 ${i+1} 条失败:`, data.msg||data.raw||JSON.stringify(data)); process.exit(1); }
            okCount++;
            if(i < chunks.length-1) await new Promise(r=>setTimeout(r,800));
          }
          console.log(`推送完成 ${okCount}/${chunks.length}`);
          NODE

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-result
          path: |
            scan_result.json
            brief.html
            chunks.json

  # ─── 每日定时扫描 + 自动推送（09:00 / 17:00 澳门时间） ───
  daily-scan-and-push:
    if: ${{ github.event_name == 'schedule' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm install

      - name: Daily scan and push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::warning::未配置 PUSHPLUS_TOKEN，仅执行扫描，不推送微信"
          fi

          PORT=3000 node server.js &
          SERVER_PID=$!
          sleep 3
          curl -sf --max-time 5 http://localhost:3000 || { echo "::error::server 未启动"; kill $SERVER_PID 2>/dev/null; exit 1; }

          # 默认全量推送：与 app.js 同步的 56 个频道
          CHANNELS_JSON='["信報財經新聞","Finance730","香港經濟日報 HKET","香港財經時報 HKBT","新城財經台","香港金融管理局","游庭皓的財經皓角","柴鼠兄弟 ZRBros","风傳媒-下班经济學","老王愛說笑","SHIN LI","自由女神邱沁宜","Better Leaf 好葉","慢活夫妻 George & Dewi","大俠武林","股乾爹 KuKanTieh","Gooaye股癌","理財不能等","懶錢包LazyWallet","M觀點","蕾咪Rami","財經 M 平方 MacroMicro","元大投顧財金頻道","股海老牛","财经风云","视野环球财经","阳光财经","ChineseFN 中文投資網","财经全世界","老李玩钱","土妹发财","贝拉说美股","美投说美股","艾爾文","寶可孟の省錢大作戰","吳淡如人生實用商學院","郭哲榮分析師","央视财经","Bloomberg中国","老徐价值投资","小Lin说","CK财经频道","钱姐说钱","硅谷居士","Mr.Market市场先生","财报狗","天下杂志","商业周刊","今周刊","非凡财经新闻","东森财经新闻","第一财经","FT中文网","观视频工作室","睡前消息","曲博科技教室"]'
          echo "Channels: $CHANNELS_JSON"

          SCAN_RESP=$(curl -s --max-time 900 -X POST http://localhost:3000/api/scan \
            -H 'Content-Type: application/json' \
            -d "{\"channels\": $CHANNELS_JSON}")
          echo "$SCAN_RESP" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              try{const j=JSON.parse(d);if(!j.items) throw Error('no items'); console.log('扫描到', j.items.length, '条');}
              catch(e){console.error('扫描结果解析失败',e.message, d.slice(0,500)); process.exit(1)}
            })"
          echo "$SCAN_RESP" > scan_result.json

          # 如果有 token 则推送
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            node << 'NODE'
            import fs from 'node:fs';
            const scan = JSON.parse(fs.readFileSync('scan_result.json','utf8'));
            const allItems = scan.items || [];
            // 时效验证：只保留最近 72 小时内发布的内容（超时 / 无法验证发布时间 → 隐藏，不推送）
            const FRESH_WINDOW_MS = 72*60*60*1000;
            const FRESH_WINDOW_LABEL = '72 小时';
            const nowMs = Date.now();
            const isFresh = x => {
              if (x.error) return true;
              const t = x.publishedAt ? new Date(x.publishedAt).getTime() : NaN;
              return Number.isFinite(t) && (nowMs - t) <= FRESH_WINDOW_MS;
            };
            const items = allItems.filter(isFresh);
            const hiddenItems = (scan.hidden || []);
            console.log(`时效验证：保留 ${items.length} 条，隐藏 ${allItems.length - items.length} 条（服务端另记录 ${hiddenItems.length} 条超时/无法验证）`);
            if (!items.length || !items.some(x => !x.error)) {
              console.log(`最近 ${FRESH_WINDOW_LABEL}内没有可推送的有效内容（超时内容已隐藏），本次不推送。`);
              fs.writeFileSync('brief.html', '<p>最近 ' + FRESH_WINDOW_LABEL + '内没有新的内容（超时内容已隐藏）</p>');
              fs.writeFileSync('chunks.json', JSON.stringify({ header: '', footer: '', chunks: [], title: '' }, null, 2));
              process.exit(0);
            }
            const esc = s => String(s||'').replace(/[&<>\"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[c]));

            // 不推个股页：剥离简报中任何按个股拆分的板块/页面，只保留全景汇总
            function stripStockSections(html) {
              if (!html) return html;
              let out = String(html);
              out = out.replace(/<section\b[^>]*data-kind=(["'])stock-page\1[^>]*>[\s\S]*?<\/section>/gi, '');
              out = out.replace(/<section\b[^>]*class=(["'])[^"']*\bstock-page\b[^"']*\1[^>]*>[\s\S]*?<\/section>/gi, '');
              out = out.replace(/<section\b[^>]*>[\s\S]*?<\/section>/gi, (m) =>
                /&gt;\s*(个股页|個股頁|STOCK PAGE)\s*<|>(个股页|個股頁|STOCK PAGE)</.test(m) ? '' : m);
              return out;
            }

            // AI 多空概率（看多 / 看空）条形图：微信会剥离 class，因此全部 inline

            const lsBar = (v, w = 10) => { const k = Math.max(0, Math.min(w, Math.round(v / 100 * w))); return '█'.repeat(k) + '░'.repeat(w - k); };

            const lsBlock = x => {

              const bb = x.bullBear;

              if (!bb || typeof bb.bull !== 'number') return '';

              const src = bb.source === 'ai' ? 'DeepSeek 多空推理' : '本地规则推算（未配置 AI Key）';

              return `<div style="margin-top:8px;padding:8px 10px;background:#031203;border:1px solid #0d9b4c;">

                      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:'Courier New',Consolas,monospace;font-size:9px;flex-wrap:wrap;">

                        <span style="background:#00ff66;color:#041404;padding:1px 5px;font-weight:700;letter-spacing:0.5px;">AI 多空概率</span>

                        <span style="background:#041404;color:#b8f2cb;padding:1px 5px;font-weight:700;">多 ${bb.bull}% / 空 ${bb.bear}%</span>

                      </div>

                      <div style="margin-top:6px;font-family:'Courier New',Consolas,monospace;font-size:10.5px;color:#b8f2cb;font-weight:700;line-height:1.9;word-break:break-all;white-space:pre-wrap;">多 ${lsBar(bb.bull)} ${bb.bull}%

            空 ${lsBar(bb.bear)} ${bb.bear}%</div>

                      <div style="margin-top:4px;font-family:'Courier New',Consolas,monospace;font-size:9px;color:#63b47f;line-height:1.7;">${esc(bb.note || '')} · 模型：${src} · 仅供研究参考，不构成投资建议${x.transcript ? '' : '<br>未读取到公开中文字幕 · 概率由 AI 依据标题与频道推算'}</div>

                    </div>`;

            };

            const sections = items.map((x,i)=> x.error
              ? `<section style="margin:10px 0;border:1px solid #b98600;background:#1a1203;box-shadow:0 0 6px rgba(255,176,0,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                  <div style="display:flex;align-items:center;gap:6px;background:#ffb000;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                    <span style="background:#041404;color:#ffb000;padding:1px 5px;">■</span>
                    <span>SCAN_ERROR.LOG</span>
                    <span style="margin-left:auto;background:#041404;color:#8a6a12;padding:1px 5px;font-weight:400;">[${i+1}] ${esc(x.channel)} · 未完成读取</span>
                  </div>
                  <p style="margin:8px 10px;color:#ffb000;font-size:11.5px;line-height:1.6;font-weight:700;font-family:'Courier New',Consolas,monospace;">&gt; ${esc(x.error)}</p>
                </section>`
              : `<section style="margin:10px 0;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 6px rgba(0,255,102,0.15);font-family:'Courier New',Consolas,'SimSun',monospace;">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;background:#00ff66;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:6px;min-width:0;word-break:break-all;">
                      <span style="background:#041404;color:#00ff66;padding:1px 5px;font-weight:400;">#${i+1}</span>
                      <span>DIR ▸ ${esc(x.channel)}</span>
                    </div>
                    ${x.status?`<span style="background:#041404;color:#8fdca4;padding:1px 5px;flex-shrink:0;font-weight:400;">${esc(x.status)}</span>`:''}
                  </div>
                  <div style="padding:10px 12px;">
                    <div style="color:#2c6742;font-family:'Courier New',Consolas,monospace;font-size:9.5px;letter-spacing:0.5px;font-weight:400;">C:\\BRIEF\\LOGS&gt; ${esc(x.publishedLabel || x.published || '')}${x.publishedMacau ? ' · ' + esc(x.publishedMacau) : ''} · 时效验证 ✓ ${FRESH_WINDOW_LABEL}内</div>
                    <h3 style="margin:6px 0 8px;font-size:13.5px;line-height:1.55;font-weight:700;">
                      <a href="${esc(x.url)}" style="color:#eafff0;font-weight:700;text-decoration:underline;text-decoration-color:#3f8f5b;text-underline-offset:3px;word-break:break-all;">&gt; ${esc(x.title)}</a>
                    </h3>
                    ${lsBlock(x)}
                    ${x.transcript ? `
                      <div style="margin-top:8px;padding:8px 10px;background:#031203;border-left:3px solid #0d9b4c;color:#8fdca4;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.75;font-weight:400;">${esc(x.transcript).replace(/(^|\n)(\d{1,2}:\d{2}(?::\d{2})?)/g, '$1<span style="color:#2c6742;font-size:10px;">$2</span>')}</div>
                    ` : ''}
                  </div>
                </section>`
            ).join('');

            // AI 总结（可选）：仅当配置了 DEEPSEEK_API_KEY 才启用
            let summaryHtml = '';
            if (process.env.DEEPSEEK_API_KEY) {
              try {
                const r = await fetch('http://localhost:3000/api/summarize', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ items })
                });
                const d = await r.json();
                if (r.ok && d && d.ok && d.summaryHtml) {
                  summaryHtml = d.summaryHtml;
                  console.log('✅ 已附加 AI 主题聚类总结');
                } else {
                  console.log('⚠️ AI 总结未启用/失败，降级推送：', d && (d.reason || d.error) || ('HTTP ' + r.status));
                }
              } catch (e) {
                console.log('⚠️ AI 总结异常，降级推送：', e.message);
              }
            } else {
              console.log('ℹ️ 未配置 DEEPSEEK_API_KEY，跳过 AI 总结');
            }

            const baseContent = `<div style="font-family:'Courier New',Consolas,'SimSun',monospace;background-color:#041404;color:#8fdca4;padding:14px 12px;font-size:12px;line-height:1.75;max-width:680px;margin:0 auto;box-sizing:border-box;letter-spacing:0.3px;">

              <!-- DOS 顶部命令行 / Command Bar -->
              <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px dashed #0d9b4c;font-family:'Courier New',Consolas,monospace;font-size:10px;margin-bottom:12px;letter-spacing:0.5px;flex-wrap:wrap;gap:4px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="display:inline-block;width:7px;height:7px;background:#00ff66;box-shadow:0 0 4px rgba(0,255,102,0.8);"></span>
                  <span style="color:#00ff66;font-weight:700;">C:\\OCTOPUS\\AI&gt; PANORAMA.EXE</span>
                </div>
                <span style="background:#00ff66;color:#041404;padding:1px 6px;font-weight:700;font-size:9px;">DOS MONITOR · 复古终端</span>
              </div>

              <!-- 时效验证说明：只保留最近 72 小时内发布的内容 -->
              <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px dashed #0d9b4c;background:#031203;font-family:'Courier New',Consolas,monospace;font-size:9.5px;margin-bottom:12px;letter-spacing:0.5px;flex-wrap:wrap;gap:4px;">
                <span style="color:#00ff66;font-weight:700;">FRESHNESS CHECK ▸ 只保留最近 ${FRESH_WINDOW_LABEL}内发布的内容</span>
                <span style="color:#63b47f;font-weight:400;">超时 / 无法验证发布时间的内容已隐藏 · 本次共 ${items.length} 条</span>
              </div>

              <!-- 视频情报流 -->
              ${sections}

              <!-- 尾页宣言 / Editorial Manifesto -->
              <div style="margin-top:16px;border:1px solid #0d9b4c;background:#072007;box-shadow:0 0 8px rgba(0,255,102,0.18);">
                <div style="display:flex;justify-content:space-between;align-items:center;background:#00ff66;color:#041404;padding:3px 8px;font-family:'Courier New',Consolas,monospace;font-size:9.5px;font-weight:700;letter-spacing:1px;flex-wrap:wrap;gap:4px;">
                  <span>EDITORIAL_MANIFESTO.TXT</span>
                  <span style="font-weight:400;opacity:0.75;">章鱼 AI · 全景视野</span>
                </div>
                <div style="padding:12px;">
                  <div style="font-size:12px;font-weight:700;color:#eafff0;line-height:1.6;margin-bottom:8px;">
                    作者：章鱼 ai &nbsp; &nbsp; &nbsp; 仅供参考，分析研究
                  </div>
                  <div style="font-size:11.5px;color:#63b47f;line-height:1.8;text-align:justify;border-left:3px solid #0d9b4c;padding:8px 10px;background:#031203;margin-bottom:10px;">
                    <span style="color:#00ff66;font-weight:700;">全网境内外为你寻找蛛丝马迹-提供全景视野分析</span> 由多模型协同推理决策 ，底层所使用的大语言模型（LLM）多模式背后结合使用了多种不同的先进模型，包括但不限于 Claude、ChatGPT、Gemini、Grok、Qwen 以及 Kimi。 根据不同的资产管理任务需求，更好地发挥各个模型的优势来提供数据支持！[加油]
                  </div>
                  <div style="font-family:'Courier New',Consolas,monospace;font-size:9px;color:#3f8f5b;font-weight:400;text-align:center;border-top:1px dashed #0d9b4c;padding-top:6px;">
                    DOS MONITOR · 复古终端 · 微信竖版阅读版 · 仅供研究参考
                  </div>
                  <div style="margin-top:8px;font-family:'Courier New',Consolas,monospace;font-size:10px;color:#2c6742;font-weight:400;">C:\\OCTOPUS\\AI&gt; EXIT<span>█</span></div>
                </div>
              </div>

            </div>`;

            // 不推个股页：发送前剥离个股板块/个股页
            const content = stripStockSections((summaryHtml || '') + baseContent);
            const title = '章鱼 AI 全景分析';
            fs.writeFileSync('brief.html', content);

            const PUSHPLUS_MAX_CHARS = 90000;
            function splitHtmlBySections(html, maxChars = PUSHPLUS_MAX_CHARS) {
              const parts=[]; const secs = html.split(/(?=<section\b)/i).filter(s=>s.trim()); let buf='';
              const flush=()=>{ if(buf.trim()){ parts.push(buf); buf=''; } };
              const splitOversizedSection=(sec,max)=>{
                const out=[]; const headMatch=sec.match(/^<section\b[^>]*>/i); const head=headMatch?headMatch[0]:'<section>'; const tailMatch=sec.match(/<\/section>\s*$/i); const tail=tailMatch?tailMatch[0]:'</section>'; const headEnd=headMatch?headMatch[0].length:9; const inner=sec.slice(headEnd, sec.length-tail.length); const pieceBudget=max-Buffer.byteLength(head+tail,'utf8');
                if(pieceBudget<=0){ let s=sec; while(Buffer.byteLength(s,'utf8')>max){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(Buffer.byteLength(s.slice(0,mid),'utf8')<=max) lo=mid; else hi=mid-1;} out.push(s.slice(0,lo)); s=s.slice(lo);} if(s) out.push(s); return out; }
                const chunks=inner.split(/(?=<\/p>|<p\b|<br\s*\/?>|。)/i); let cur='';
                for(const c of chunks){ if(Buffer.byteLength(c,'utf8')>pieceBudget){ if(cur){ out.push(head+cur+tail); cur=''; } let s=c; while(Buffer.byteLength(s,'utf8')>pieceBudget){ let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(Buffer.byteLength(s.slice(0,mid),'utf8')<=pieceBudget) lo=mid; else hi=mid-1;} let cut=lo; const win=s.slice(Math.max(0,lo-200),lo); const m=win.match(/[。！？\n]/g); if(m) cut=lo-200+win.lastIndexOf(m[m.length-1])+1; out.push(head+s.slice(0,cut)+tail); s=s.slice(cut);} if(s) cur=s; } else if(Buffer.byteLength(cur+c,'utf8')>pieceBudget && cur){ out.push(head+cur+tail); cur=c; } else { cur+=c; } } if(cur) out.push(head+cur+tail); return out;
              };
              for(const sec of secs){ if(Buffer.byteLength(sec,'utf8')>maxChars){ flush(); for(const p of splitOversizedSection(sec,maxChars)) parts.push(p); continue; } if(Buffer.byteLength(buf+sec,'utf8')>maxChars) flush(); buf+=sec; } flush(); return parts;
            }

            let header='', footer='', bodyOnly=content;
            const firstIdx=content.search(/<section\b/i); const lastEnd=content.toLowerCase().lastIndexOf('</section>');
            if(firstIdx!==-1 && lastEnd!==-1 && lastEnd>firstIdx){ header=content.slice(0,firstIdx); footer=content.slice(lastEnd+'</section>'.length); bodyOnly=content.slice(firstIdx,lastEnd+'</section>'.length); }
            else if(firstIdx!==-1){ header=content.slice(0,firstIdx); bodyOnly=content.slice(firstIdx); footer=''; }
            const overhead=Buffer.byteLength(header+footer,'utf8');
            let chunks= overhead>90000 ? splitHtmlBySections(content,90000) : splitHtmlBySections(bodyOnly, 90000-overhead);
            if(!chunks.length){ const fb=(header+bodyOnly+footer)||content; chunks=splitHtmlBySections(fb,90000); if(!chunks.length) chunks=[fb]; if(header||footer){header=''; footer='';} }
            console.log(`内容 ${Buffer.byteLength(content,'utf8')} 字节，分 ${chunks.length} 条发送`);
            fs.writeFileSync('chunks.json', JSON.stringify({header, footer, chunks, title}, null, 2));

            const token = process.env.PUSHPLUS_TOKEN;
            let okCount=0;
            for(let i=0;i<chunks.length;i++){
              const partTitle = chunks.length>1 ? `${title} (${i+1}/${chunks.length})` : title;
              const partContent = (header||footer) ? `${header}${chunks[i]}${footer}` : chunks[i];
              const payload = JSON.stringify({ token, title: partTitle, content: partContent, template: 'html', channel: 'wechat' });
              console.log(`推送 ${i+1}/${chunks.length}: ${partTitle} (${Buffer.byteLength(partContent,'utf8')} bytes)`);
              let r, text, data;
              try {
                r = await fetch('https://www.pushplus.plus/send', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: payload });
                text = await r.text();
                try{ data=JSON.parse(text);}catch{ data={raw:text} }
              } catch(e){
                console.error(`第 ${i+1} 条网络异常:`, e.message);
                process.exit(1);
              }
              console.log(`  -> HTTP ${r.status}`, JSON.stringify(data).slice(0,500));
              if(data.code!==200){ console.error(`第 ${i+1} 条失败:`, data.msg||data.raw||JSON.stringify(data)); process.exit(1); }
              okCount++;
              if(i < chunks.length-1) await new Promise(r=>setTimeout(r,800));
            }
            console.log(`推送完成 ${okCount}/${chunks.length}`);
          NODE
          fi

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-result
          path: |
            scan_result.json
            brief.html
            chunks.json
